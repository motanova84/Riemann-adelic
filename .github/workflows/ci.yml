name: CI Simbiótico SABIO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_full_validation:
        description: "¿Ejecutar validación completa?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  validacion-simbolica:
    name: Validación Simbiótica SABIO Ψ
    runs-on: ubuntu-latest
    env:
      VALIDATION_LEVEL: ${{ github.event.inputs.run_full_validation == 'true' && '500' || '100' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Lean 4 (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          source "$HOME/.elan/env" || true
          elan toolchain install "$(cat formalization/lean/lean-toolchain)"
          elan default "$(cat formalization/lean/lean-toolchain)"
          lean --version
          lake --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (basic)
        if: env.VALIDATION_LEVEL == '100'
        run: |
          pytest tests/test_ci_simbiotico_sabio.py tests/test_sabio_validator.py --maxfail=3 --disable-warnings -k "not slow"

      - name: Run tests (full)
        if: env.VALIDATION_LEVEL == '500'
        run: |
          pytest tests/ --maxfail=5 --disable-warnings
          python3 validate_v5_coronacion.py --precision 25 --verbose --update-manifest

      - name: Lean build RiemannAdelic
        if: env.VALIDATION_LEVEL == '500'
        run: |
          cd formalization/lean
          source "$HOME/.elan/env" || true
          lake exe cache get
          lake build RiemannAdelic

      - name: Lean axioms audit (final theorem)
        if: env.VALIDATION_LEVEL == '500'
        run: |
          cd formalization/lean
          source "$HOME/.elan/env" || true
          cat > /tmp/axioms_audit.lean <<'EOF'
          import RiemannAdelic.Coronacion_Final
          #print axioms RiemannAdelic.CoronacionFinal.riemann_hypothesis_cosmic_closure
          EOF
          lake env lean /tmp/axioms_audit.lean | tee /tmp/axioms_output.txt
          grep -F "propext" /tmp/axioms_output.txt
          grep -F "Classical.choice" /tmp/axioms_output.txt
          grep -F "Quot.sound" /tmp/axioms_output.txt

      - name: SAT latest-only validation
        if: env.VALIDATION_LEVEL == '500'
        run: |
          python3 scripts/validate_sat_certificates.py --all --latest-only

      - name: SAT post-CI closure audit
        if: env.VALIDATION_LEVEL == '500'
        run: |
          python3 scripts/audit_latest_sat_certificates.py --cert-dir certificates/sat --expected-theorems 10

      - name: Generar reporte simbiótico
        run: |
          echo "JMMB Ψ · SABIO ∞³" >> "$GITHUB_STEP_SUMMARY"
          echo "f₀ = 141.7001 Hz" >> "$GITHUB_STEP_SUMMARY"
          echo "VALIDATION_LEVEL=${VALIDATION_LEVEL}" >> "$GITHUB_STEP_SUMMARY"

  validate-metadata:
    name: Validate metadata and beacon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate beacon markers
        run: |
          grep -q "141.7001" .qcal_beacon
          grep -qi "zenodo" .qcal_beacon

  verify-conversion:
    name: Verify conversion artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify core files
        run: |
          test -f validate_v5_coronacion.py
          test -f sabio_validator.py
