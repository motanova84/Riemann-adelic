name: QCAL Ω Audit
on:
  push:
    paths: ['ledger/**','scripts/validate_omega_ledger.py','.github/workflows/qcal-omega-audit.yml','**/*.lean']
  pull_request:
    paths: ['ledger/**','scripts/validate_omega_ledger.py','.github/workflows/qcal-omega-audit.yml','**/*.lean']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate evidence ledger and inheritance
        run: python3 scripts/validate_omega_ledger.py ledger/omega.json
      - name: Install Lean toolchain
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env" || true
          elan toolchain install "$(cat formalization/lean/lean-toolchain)"
          elan default "$(cat formalization/lean/lean-toolchain)"
      - name: Build Lean project
        working-directory: formalization/lean
        run: |
          source "$HOME/.elan/env" || true
          lake exe cache get
          lake build RiemannAdelic
